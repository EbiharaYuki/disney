name: Collect ticket prices from web archive

on:
  schedule:
    # 毎週月曜 JST 5:17（アーカイブに新しく保存されたページを拾う）
    - cron: "17 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_prices.py
        timeout-minutes: 45
      - name: Commit (also after a timeout, to keep progress)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: ticket prices from web archive $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
