name: Probe official pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wayback coverage
        run: |
          set +e
          for pat in ticket/index tdl/ticket/index tds/ticket/index ticket/sales_status en/ticket/index en/tdl/ticket/index en/tds/ticket/index; do
            n=$(curl -s --max-time 60 "https://web.archive.org/cdx/search/cdx?url=tokyodisneyresort.jp/$pat/*&filter=statuscode:200&collapse=urlkey&fl=original" | grep -c "20[0-9][0-9]" || true)
            echo "== $pat: $n months"
            curl -s --max-time 60 "https://web.archive.org/cdx/search/cdx?url=tokyodisneyresort.jp/$pat/*&filter=statuscode:200&collapse=urlkey&fl=timestamp,original" | grep -oE "[0-9]{14} .*/(20[0-9]{4})" | awk '{print substr($1,1,8), $2}' | sed -E 's#https?://www.tokyodisneyresort.jp/##' | tr '\n' ';' | head -c 3000; echo
          done
      - name: Sample snapshot structure
        run: |
          curl -s --max-time 60 -o s.html "https://web.archive.org/web/20251016095354id_/https://www.tokyodisneyresort.jp/tdl/ticket/index/202511/"
          wc -c s.html
          grep -n -E "円|price|Price|calendar" s.html | head -30
          python3 - <<'PY'
          import re
          t=open('s.html',encoding='utf-8',errors='replace').read()
          i=t.find('7,900'); i = i if i>=0 else t.find('9,900')
          print(t[max(0,i-1500):i+800])
          PY
