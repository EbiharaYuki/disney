name: Collect wait times

on:
  schedule:
    # JST 8:00〜21:45 に15分おき (cron は UTC)
    - cron: "*/15 23 * * *"
    - cron: "*/15 0-12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-wait-times
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch wait times
        run: python3 scripts/collect.py

      - name: Build daily summary
        run: python3 scripts/build_stats.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: wait times $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
